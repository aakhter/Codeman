name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    name: Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check package-lock.json version sync
        run: npm run check:lockfile

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Frontend JS syntax check
        run: npm run check:frontend-syntax

      - name: Format check
        run: npm run format:check

      - name: Server boot smoke test
        run: |
          set -u
          if ! command -v tmux >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y tmux
          fi
          npx tsx src/index.ts web --port 3151 > /tmp/boot.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3151/api/status -o /dev/null; then
              echo "Server booted in ${i}s"
              exit 0
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server exited before becoming ready. Logs:"
              cat /tmp/boot.log
              exit 1
            fi
            sleep 1
          done
          echo "Server did not respond on /api/status within 30s. Logs:"
          cat /tmp/boot.log
          exit 1

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install tmux
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y tmux
          fi

      - name: Run unit & integration tests
        # Excludes the browser-driven mobile suite (test/mobile/**); see config/vitest.ci.config.ts.
        # The mobile suite runs in the separate, non-blocking `mobile` job below.
        # Safe in CI: TmuxManager no-ops all shell commands under VITEST (test/setup.ts).
        run: npm run test:ci

  mobile:
    name: Mobile suite (allow-fail)
    runs-on: ubuntu-latest
    # NON-BLOCKING (COD-83): the browser-driven mobile suite needs chromium and
    # compares DPR-aware PNG baselines + some env-sensitive geometry that render
    # differently across machines. Marking the job continue-on-error keeps those
    # environment diffs from reddening the build while still running the suite and
    # surfacing diffs (uploaded as artifacts) for human review. Behavioral coverage
    # is advisory here until/unless a pinned canonical CI env is introduced.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install tmux
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y tmux
          fi

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile suite (non-blocking)
        # Each test file starts an in-process WebServer on its own port (helpers/server.ts);
        # no build needed (vitest transforms src). Visual diffs are written next to baselines.
        run: npm run test:mobile

      - name: Upload visual-regression diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-diffs
          path: |
            test/mobile/snapshots/*.actual.png
            test/mobile/snapshots/*.diff.png
          if-no-files-found: ignore
          retention-days: 14
